[package]
name = "audio2mqtt"
version = "1.5.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
audiopus = "0.2"
base64 = "0.22"
axum = { version = "0.7", features = ["json", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
hound = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rumqttc = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slog = "2.7"
tokio = { version = "1.40", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tsclientlib = { version = "0.2", features = ["audiopus"] }
tsproto-packets = "0.1"
uuid = { version = "1.10", features = ["v4", "serde"] }
voice_activity_detector = { version = "0.2.1", features = ["load-dynamic"] }
whisper-rs = { version = "0.16", features = ["cuda", "tracing_backend"] }

[patch.crates-io]
tsproto = { path = "vendor/tsproto-0.2.0" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
